<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdBlocker Pro</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body class="light">

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <img src="../assets/icons/icon48.png" alt="logo" width="24" height="24" />
      <span class="logo-text">AdBlocker <strong>Pro</strong></span>
    </div>
    <div class="header-controls">
      <button id="darkModeBtn" class="icon-btn" title="Toggle dark mode">🌙</button>
      <label class="toggle-switch" title="Enable / Disable">
        <input type="checkbox" id="mainToggle" checked />
        <span class="slider"></span>
      </label>
    </div>
  </header>

  <!-- Status banner -->
  <div id="statusBanner" class="status-banner active">
    <span id="statusText">Protection Active</span>
  </div>

  <!-- Stats cards -->
  <section class="stats-grid">
    <div class="stat-card">
      <div class="stat-value" id="totalBlocked">—</div>
      <div class="stat-label">Total Blocked</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="blockedToday">—</div>
      <div class="stat-label">Today</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="trackerBlocked">—</div>
      <div class="stat-label">Trackers</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="rulesCount">—</div>
      <div class="stat-label">Rules</div>
    </div>
  </section>

  <!-- Tabs -->
  <nav class="tabs">
    <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
    <button class="tab-btn" data-tab="whitelist">Whitelist</button>
    <button class="tab-btn" data-tab="advanced">Advanced</button>
  </nav>

  <!-- Dashboard tab -->
  <section class="tab-content active" id="tab-dashboard">
    <h3 class="section-title">Top Blocked Domains</h3>
    <ul id="topDomainsList" class="domain-list">
      <li class="placeholder">Loading…</li>
    </ul>
    <h3 class="section-title">Daily Activity (7 days)</h3>
    <canvas id="dailyChart" width="320" height="120"></canvas>
  </section>

  <!-- Whitelist tab -->
  <section class="tab-content" id="tab-whitelist">
    <div class="whitelist-input-row">
      <input
        type="text"
        id="whitelistInput"
        placeholder="example.com"
        maxlength="253"
      />
      <button id="addWhitelistBtn" class="btn-primary">Add</button>
    </div>
    <ul id="whitelistList" class="domain-list">
      <li class="placeholder">No whitelisted domains</li>
    </ul>
  </section>

  <!-- Advanced tab -->
  <section class="tab-content" id="tab-advanced">
    <div class="toggle-row">
      <label>Block Ads</label>
      <label class="toggle-switch">
        <input type="checkbox" id="blockAds" checked />
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <label>Block Trackers</label>
      <label class="toggle-switch">
        <input type="checkbox" id="blockTrackers" checked />
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <label>ML Detection</label>
      <label class="toggle-switch">
        <input type="checkbox" id="enableMl" checked />
        <span class="slider"></span>
      </label>
    </div>
    <div class="separator"></div>
    <button id="updateFiltersBtn" class="btn-secondary full-width">
      Update Filter Lists
    </button>
    <div id="updateStatus" class="update-status"></div>
  </section>

  <footer class="footer">
    <span id="footerStatus">Backend: connecting…</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
